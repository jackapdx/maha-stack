version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=http://localhost:4200
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules
    networks:
      - maha-enterprise-network

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    ports:
      - "4200:80"
    environment:
      - NODE_ENV=production
      - API_URL=http://api:3000
    depends_on:
      - api
    networks:
      - maha-enterprise-network

networks:
  maha-enterprise-network:
    driver: bridge